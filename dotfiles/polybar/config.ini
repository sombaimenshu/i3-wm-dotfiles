[colors]
background = #091f38
background-alt = #3E567A
foreground = #ffffff
primary = #FF1378
secondary = #194375
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 24pt
radius = 11
bottom = true
; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = 
separator-foreground = ${colors.disabled}

;font-0 = monospace;2
font-0 = "JetBrainsMono Nerd Font:size=16;2"
font-1 = "Symbols Nerd Font Mono:size=16;3"


modules-left = xworkspaces xwindow
modules-right = wlan pulseaudio bluetooth-script memory cpu powermenu
modules-center = dateandtime

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

;[module/xwindow]
;type = internal/xwindow
;label = %title:0:60:...%

#[module/filesystem]
#type = internal/fs
#interval = 25

#mount-0 = /

#label-mounted = %{F#FA7A7A}%mountpoint%%{F-} %percentage_used%%

#label-unmounted = %mountpoint% not mounted
#label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume> <bar-volume>

label-volume = %percentage:2%%

format-muted-prefix = " "
label-muted = muted
label-muted-foreground = ${colors.disabled}

bar-volume-width = 11
bar-volume-foreground = #FF1378
bar-volume-gradient = false
bar-volume-indicator = ""
bar-volume-indicator-font = 2
bar-volume-fill = %{F#FF1378}━%{F-}

#▰
bar-volume-fill-font = 2
bar-volume-empty = ━
#▱
bar-volume-empty-font = 2
bar-volume-empty-foreground = ${colors.foreground-alt}

click-right = pavucontrol &

#[module/xkeyboard]
#type = internal/xkeyboard
#blacklist-0 = num lock

#label-layout = %layout%
#label-layout-foreground = ${colors.primary}

#label-indicator-padding = 2
#label-indicator-margin = 1
#label-indicator-foreground = ${colors.background}
#label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.primary}
label = %percentage:1%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#FA7A7A}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %signal%%

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/powermenu]
type = custom/menu

expand-right = true
format-spacing = 0

label-open = " "
label-open-foreground = ${colors.primary}
label-close =  cancel
label-close-foreground = ${colors.primary}
label-separator = " "
label-separator-foreground = ${colors.foreground-alt}

menu-0-0 = reboot
menu-0-0-exec = systemctl reboot
menu-0-1 = poweroff
menu-0-1-exec = systemctl poweroff
menu-0-2 = exit
menu-0-2-exec = i3-msg exit
menu-0-3 = lock
menu-0-3-exec = i3lock-color-fancy

[module/bluetooth-script] 
type = custom/script
exec = /home/adnan/Documents/polybar-scripts/bluetoothscript.sh
interval = 2
tail = true
click-left = /home/adnan/Documents/polybar-scripts/bluetoothscript.sh --toggle &

[module/date]
type = internal/date
interval = 1
date = %H:%{F#ffffff}%M%{F-}:%{F#FF1378}%S%{F-}
date-alt = %Y-%{F#ffffff}%m%{F-}-%{F#ffffff}%d%{F-} %{F#FF1378}%H%{F-}:%{F#ffffff}%M%{F-}:%{F#FF1378}%S%{F-}

label = %date%
label-foreground = ${colors.primary}
[module/dateandtime]
type = internal/date
interval = 1

date = " %{F#FF1378}%d%{F-} %b, %{F#ff1378}%A%{F-}"

;date-alt = " %A, %b %d %Y"

time = %l:%M:%S %{F#FF1378}%p%{F-}
;time-alt = %l:%M:%S %p

format-prefix = "󱛡 "
format-prefix-foreground = ${colors.foreground}
;format-underline = #ff1378

label = %date% %time%

[module/bar]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume> <bar-volume>
label-volume = VOL %percentage%%
label-volume-foreground = ${root.foreground}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 墳
ramp-volume-3 = 墳
ramp-volume-4 = 
ramp-volume-foreground = ${colors.foreground-alt}

label-muted = 婢 muted
label-muted-foreground = #666

bar-volume-width = 11
bar-volume-foreground-0 = #55aa55
bar-volume-foreground-1 = #55aa55
bar-volume-foreground-2 = #55aa55
bar-volume-foreground-3 = #55aa55
bar-volume-foreground-4 = #55aa55
bar-volume-foreground-5 = #f5a70a
bar-volume-foreground-6 = #ff5555
bar-volume-gradient = false
bar-volume-indicator = ""
bar-volume-indicator-font = 2
bar-volume-fill = ━
#▰
bar-volume-fill-font = 2
bar-volume-empty = ━
#▱
bar-volume-empty-font = 2
bar-volume-empty-foreground = ${colors.foreground-alt}

click-right = pavucontrol &
[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
